<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="socket.io.js"></script>
</head>

<body>
    <h1>Current Count:<span id="cnt"></span></h1>
    <button onclick="incCount()">Inc Count</button>
    <script>
        const socket = io();
        socket.on('liveCount', (msg) => {
            document.getElementById("cnt").innerHTML = msg.liveCount;
        })
        function incCount() {
            alert("incCount")
            socket.emit("incCount", { msg: 'update' })
        }
    </script>
</body>

</html>
