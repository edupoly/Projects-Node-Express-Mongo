<html>

<head>
    <script src="socket.io.js"></script>
    <style>
        * {
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <h1>Edupoly Group Chat</h1>
    <div>
        <div>
            <ul id="chatmessages" style="list-style: none;padding:0px"></ul>
        </div>
        <div>
            <input type="text" name="usermessage" id="mymessage">
            <button onclick="sendMessage()">Send Message</button>
        </div>
    </div>
    <script>
        var socket = io();
        var username = prompt("")
        socket.emit("messageVachindi", { message: "connected", username })
        socket.on("messageVachindi", function (ms) {
            var li = document.createElement("li")
            li.innerHTML = `<b>${ms.username}</b>:<span>${ms.message}</span>`;
            document.getElementById("chatmessages").appendChild(li)
            console.log(ms);
        })
        function sendMessage() {
            socket.emit("messageVachindi", { message: document.getElementById("mymessage").value, username })
        }
    </script>
</body>

</html>
